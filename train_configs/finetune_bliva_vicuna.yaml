model:
  arch: bliva_vicuna
  model_type: vicuna7b
  load_finetuned: False
  load_pretrained: True

  pretrained: "/rydata/wengchaoliu/BLIVA/bliva_finetune_weight/bliva_vicuna7b.pth"
  finetuned: ""

  # vit encoder
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16"
  freeze_vit: True

  # Q-Former
  num_query_token: 32

  # path to Vicuna checkpoint
  llm_model: "/rydata/wengchaoliu/BLIVA/vicuna/weight/vicuna-7b"

  # generation configs
  prompt: ""

datasets:
  metervqa:
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"

run:
  runner: runner_iter

  task: image_text_pretrain
  # optimizer
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 0
  warmup_lr: 1e-8
  accum_grad_iters: 1

  weight_decay: 0.05
  max_epoch: 8 

  max_iters: 200000
  iters_per_inner_epoch: 50000

  batch_size_train: 8
  batch_size_eval: 1 
  num_workers: 1
  warmup_steps: 1000

  seed: 42
  output_dir: "/wangx_nas/WCL/checkpoint/output/finetuned_bliva_vicuna/bliva"
  
  amp: True
  resume_ckpt_path: null

  evaluate: False 
  train_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True

  train_dataset_ratios: {metervqa:  1}
