
model:
  arch: vicuna7b
  load_finetuned: True 
  load_pretrained: False

  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/InstructBLIP/instruct_blip_vicuna7b_trimmed.pth"
  finetuned: "/rydata/wengchaoliu/BLIVA/bliva/output/finetuned_bliva_vicuna/new_finetune_bliva_vicuna/withoutkeyming/20250813104/checkpoint_100000.pth"
  # vit encoder
  image_size: 224
  drop_path_rate: 0
  use_grad_checkpoint: False
  vit_precision: "fp16" 
  freeze_vit: True

  # Q-Former
  num_query_token: 32

  # path to Vicuna checkpoint
  llm_model: "/rydata/wengchaoliu/BLIVA/vicuna/weight/vicuna-7b"

  # generation config
  prompt: ""


preprocess: 
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
        eval:
          name: "blip_image_eval"
          image_size: 224 
    text_processor:
        train:
          name: "blip_caption"
        eval:
          name: "blip_caption"
